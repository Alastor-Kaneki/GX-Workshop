name: Probe GX endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-gx-download.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch cursor theme sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cursor-artifacts/work
          cd cursor-artifacts/work

          echo 'Fetching Bibata Modern Classic v2.0.7...'
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Classic.tar.xz' \
            -o Bibata-Modern-Classic.tar.xz
          tar -xJf Bibata-Modern-Classic.tar.xz
          test -d Bibata-Modern-Classic
          zip -qr ../Bibata-Modern-Classic.zip Bibata-Modern-Classic

          echo 'Fetching TriPoint Inversus...'
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://mods.store.gx.me/mods/1e6f2a0f-fae8-4a9f-beda-9030f6371960/6529b8f8-c891-421a-8de8-f9fe32220804/df5d5225-8047-4bdd-9fe9-79d51d9de971/mod.crx' \
            -o TriPoint-Inversus.crx

          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile

          src = Path('TriPoint-Inversus.crx')
          data = src.read_bytes()
          if data[:4] == b'PK\x03\x04':
              payload = data
          elif data[:4] == b'Cr24':
              version = struct.unpack_from('<I', data, 4)[0]
              if version == 2:
                  pub_len, sig_len = struct.unpack_from('<II', data, 8)
                  off = 16 + pub_len + sig_len
              elif version == 3:
                  header_len = struct.unpack_from('<I', data, 8)[0]
                  off = 12 + header_len
              else:
                  raise SystemExit(f'Unsupported CRX version {version}')
              payload = data[off:]
          else:
              raise SystemExit('Downloaded GX package is neither ZIP nor CRX')

          out = Path('../TriPoint-Inversus-full.zip')
          out.write_bytes(payload)
          with zipfile.ZipFile(out) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = z.namelist()
              Path('../TriPoint-Inversus-tree.txt').write_text('\n'.join(names) + '\n', encoding='utf-8')
              matches = [n for n in names if 'ultraviolet' in n.lower()]
              Path('../TriPoint-Inversus-ultraviolet-matches.txt').write_text('\n'.join(matches) + '\n', encoding='utf-8')
          print(f'TriPoint ZIP entries: {len(names)}; ultraviolet matches: {len(matches)}')
          PY

          sha256sum ../Bibata-Modern-Classic.zip ../TriPoint-Inversus-full.zip > ../SHA256SUMS.txt
          ls -lh ../

      - name: Upload cursor archives
        uses: actions/upload-artifact@v4
        with:
          name: cursor-theme-sources
          path: |
            cursor-artifacts/Bibata-Modern-Classic.zip
            cursor-artifacts/TriPoint-Inversus-full.zip
            cursor-artifacts/TriPoint-Inversus-tree.txt
            cursor-artifacts/TriPoint-Inversus-ultraviolet-matches.txt
            cursor-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
