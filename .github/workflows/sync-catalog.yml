name: Sync GX catalog
# Pipeline v2.2: full Desktop + Mobile discovery, metadata repair, guarded validation.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-catalog.mjs'
      - 'scripts/enrich-catalog.mjs'
      - '.github/workflows/sync-catalog.yml'

concurrency:
  group: gx-catalog-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover and refresh full GX catalog
        run: node scripts/sync-catalog.mjs
        env:
          MAX_PAGES: '500'
          DETAIL_LIMIT: '20000'
          REFRESH_LIMIT: '1200'
          RECENT_PAGES: '12'
          CONCURRENCY: '8'
          DETAIL_DELAY_MS: '35'

      - name: Repair incomplete card metadata
        run: node scripts/enrich-catalog.mjs
        env:
          ENRICH_LIMIT: '20000'
          ENRICH_CONCURRENCY: '10'
          ENRICH_DELAY_MS: '45'

      - name: Validate generated catalog
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const data = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const mods = Array.isArray(data) ? data : data.mods || [];

          let previousCount = 0;
          try {
            const old = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:data/catalog.json'], { encoding: 'utf8' }));
            previousCount = (Array.isArray(old) ? old : old.mods || []).length;
          } catch {}

          const minimum = Math.max(8000, previousCount >= 8000 ? Math.floor(previousCount * 0.8) : 0);
          if (mods.length < minimum) throw new Error(`Catalog suspiciously small: ${mods.length}; minimum ${minimum}`);

          const ids = new Set(mods.map(m => m.id));
          if (ids.size !== mods.length) throw new Error(`Duplicate IDs: ${mods.length - ids.size}`);

          const packages = mods.filter(m => m.packageUrl).length;
          const images = mods.filter(m => m.image).length;
          const descriptions = mods.filter(m => m.description).length;
          const knownAuthors = mods.filter(m => m.author && m.author !== 'Unknown studio').length;
          if (!packages) throw new Error('Catalog contains zero resolved package URLs');
          if (!images) throw new Error('Catalog contains zero artwork URLs');
          console.log(`validated ${mods.length} mods; ${packages} packages; ${images} images; ${descriptions} descriptions; ${knownAuthors} known authors; previous ${previousCount}`);
          NODE

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/catalog.json; then exit 0; fi
          git config user.name "gx-workshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "sync GX catalog"
          git pull --rebase origin main
          git push
