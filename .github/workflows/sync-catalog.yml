name: Sync GX catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-catalog.mjs
        env:
          MAX_PAGES: '20'
          DETAIL_LIMIT: '400'
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/catalog.json; then exit 0; fi
          git config user.name "gx-workshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "sync GX catalog"
          git push
